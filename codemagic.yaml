# ==============================================================================
# Codemagic CI/CD Configuration for Treegoh Botanical Sanctuary (Expo SDK 58 / React Native)
# TestFlight & App Store Connect Deployment Pipeline
# ==============================================================================

workflows:
  ios-testflight:
    name: Treegoh iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.treegoh.app
      vars:
        BUNDLE_ID: "com.treegoh.app"
        APPLE_TEAM_ID: "855K4HU668"
        XCODE_WORKSPACE: "app/ios/Treegoh.xcworkspace"
        XCODE_SCHEME: "Treegoh"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: |
          echo "📦 Instalando dependencias de Node.js en el directorio /app..."
          cd app
          npm install --legacy-peer-deps
      
      - name: Expo Prebuild (Generate native iOS Xcode project)
        script: |
          echo "🛠️ Ejecutando Expo Prebuild para generar app/ios/Treegoh.xcworkspace..."
          cd app
          npx expo prebuild --platform ios --clean
      
      - name: Install CocoaPods
        script: |
          echo "🍎 Instalando CocoaPods nativos de iOS..."
          cd app/ios
          pod install
      
      - name: Set up code signing settings on Xcode project
        script: |
          echo "🔐 Configurando perfiles de aprovisionamiento y certificados de firma..."
          xcode-project use-profiles
      
      - name: Increment iOS Build Number
        script: |
          echo "🔢 Actualizando número de compilación con Codemagic BUILD_NUMBER ($BUILD_NUMBER)..."
          cd app/ios
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      
      - name: Build IPA for TestFlight
        script: |
          echo "🚀 Compilando archivo IPA con xcode-project build-ipa..."
          xcode-project build-ipa \
            --workspace "app/ios/Treegoh.xcworkspace" \
            --scheme "Treegoh"
            
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - app/ios/*.xcarchive
      
    publishing:
      email:
        recipients:
          - desarrolloxprinta@gmail.com
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-build-check:
    name: Treegoh iOS Verification (Simulator / Dry Run)
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install Node dependencies
        script: |
          cd app
          npm install --legacy-peer-deps
      - name: Expo Prebuild (Generate native iOS project)
        script: |
          cd app
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd app/ios
          pod install
      - name: Verify Xcode Compilation (Simulator)
        script: |
          xcodebuild -workspace "app/ios/Treegoh.xcworkspace" \
            -scheme "Treegoh" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

