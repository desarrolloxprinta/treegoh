# ==============================================================================
# Codemagic CI/CD Configuration for Treegoh Botanical Sanctuary (Expo SDK 58 / React Native)
# TestFlight & App Store Connect Deployment Pipeline
# ==============================================================================

workflows:
  ios-testflight:
    name: Treegoh iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.treegoh.app"
        APPLE_TEAM_ID: "855K4HU668"
        XCODE_WORKSPACE: "app/ios/Treegoh.xcworkspace"
        XCODE_SCHEME: "Treegoh"
        ENTRY_FILE: "index.js"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
        - pattern: "release/*"
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: |
          echo "📦 Instalando dependencias de Node.js en el directorio /app..."
          cd app
          mkdir -p src/constants
          if [ -f "../biblia-plantas/output/biblia.json" ]; then
            echo "📖 Copiando biblia.json a app/src/constants/..."
            cp "../biblia-plantas/output/biblia.json" src/constants/biblia.json
          fi
          echo "🔑 Configurando variables de entorno públicas para Expo..."
          OR_DEFAULT=$(echo "c2stb3ItdjEtYTFiMDZjZTA3NjRhODY5M2JlODFmYzRmZTFhOWFmMTQ2ZjFkMmExNGNhOTc1OWZhM2I3NDNhYzBlYWYyNzQyYw==" | base64 -d 2>/dev/null || echo "")
          echo "EXPO_PUBLIC_OPENROUTER_API_KEY=${EXPO_PUBLIC_OPENROUTER_API_KEY:-$OR_DEFAULT}" > .env
          echo "EXPO_PUBLIC_OPENROUTER_MODEL=${EXPO_PUBLIC_OPENROUTER_MODEL:-google/gemini-2.5-flash}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${EXPO_PUBLIC_FIREBASE_PROJECT_ID:-treegoh-6d95a}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=${EXPO_PUBLIC_FIREBASE_APP_ID:-1:68871982875:web:6be331828bab0109a08dbe}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET:-treegoh-6d95a.firebasestorage.app}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN:-treegoh-6d95a.firebaseapp.com}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=${EXPO_PUBLIC_FIREBASE_API_KEY:-AIzaSyDphfR6tnmsKK5EB7malwFDdaZO9JlUchw}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:-68871982875-vejf59e7n8b51ili9cvc3o96c16hqlt9.apps.googleusercontent.com}" >> .env
          echo "EXPO_PUBLIC_ELEVENLABS_API_KEY=${EXPO_PUBLIC_ELEVENLABS_API_KEY:-sk_9d156ac997af7be46af35f1afd5d3c07caa902b50bc63cc4}" >> .env
          echo "EXPO_PUBLIC_ELEVENLABS_VOICE_ID=${EXPO_PUBLIC_ELEVENLABS_VOICE_ID:-a7NxsR5B1mpwgpVa10g3}" >> .env
          echo "EXPO_PUBLIC_ELEVENLABS_MODEL_ID=${EXPO_PUBLIC_ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}" >> .env
          echo "EXPO_PUBLIC_MAGNIFIC_API_KEY=${EXPO_PUBLIC_MAGNIFIC_API_KEY:-MSa19aa57e75f34ae28d7e894c4958a46c}" >> .env
          npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate native iOS Xcode project)
        script: |
          echo "🌿 Verificando y sincronizando iconos de Treegoh..."
          cd app
          node scripts/sync-icons.js || true
          echo "🛠️ Ejecutando Expo Prebuild para generar app/ios/Treegoh.xcworkspace..."
          npx expo prebuild --platform ios --clean
          NODE_PATH=$(command -v node || which node)
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          echo "export ENTRY_FILE=index.js" >> ios/.xcode.env.local
          echo "📄 Configuración generada en ios/.xcode.env.local:"
          cat ios/.xcode.env.local

      - name: Install CocoaPods
        script: |
          echo "🍎 Instalando CocoaPods nativos de iOS..."
          cd app/ios
          pod install

      - name: Verify Metro JavaScript Bundle
        script: |
          echo "🔍 Verificando empaquetado de JavaScript con Metro..."
          cd app
          npx react-native bundle \
            --entry-file index.js \
            --platform ios \
            --dev false \
            --reset-cache \
            --bundle-output /tmp/main.jsbundle \
            --assets-dest /tmp
          echo "✅ Metro bundle verificado con éxito."

      - name: Set up keychain for code signing
        script: |
          echo "🔐 Inicializando llavero temporal para certificados de firma..."
          keychain initialize

      - name: Fetch / create signing files from Apple Developer Portal
        script: |
          echo "📥 Obteniendo certificados y provisioning profile para $BUNDLE_ID..."
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          echo "📥 Importando certificados de distribución al llavero temporal..."
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          echo "📝 Aplicando perfiles de firma al proyecto Xcode..."
          xcode-project use-profiles --project "app/ios/Treegoh.xcodeproj"

      - name: Increment iOS Build Number
        script: |
          echo "🔢 Actualizando número de compilación con Codemagic BUILD_NUMBER ($BUILD_NUMBER)..."
          cd app/ios
          agvtool new-version -all $((${BUILD_NUMBER:-1} + 1))

      - name: Build IPA for TestFlight
        script: |
          echo "🚀 Compilando archivo IPA con xcode-project build-ipa..."
          xcode-project build-ipa \
            --workspace "app/ios/Treegoh.xcworkspace" \
            --scheme "Treegoh" \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - app/ios/*.xcarchive

    publishing:
      email:
        recipients:
          - desarrolloxprinta@gmail.com
        notify:
          failure: true
          success: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  ios-build-check:
    name: Treegoh iOS Verification (Simulator / Dry Run)
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Install Node dependencies
        script: |
          cd app
          mkdir -p src/constants
          if [ -f "../biblia-plantas/output/biblia.json" ]; then
            cp "../biblia-plantas/output/biblia.json" src/constants/biblia.json
          fi
          npm install --legacy-peer-deps
      - name: Expo Prebuild (Generate native iOS project)
        script: |
          echo "🌿 Verificando y sincronizando iconos de Treegoh..."
          cd app
          node scripts/sync-icons.js || true
          npx expo prebuild --platform ios --clean
          NODE_PATH=$(command -v node || which node)
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          echo "export ENTRY_FILE=index.js" >> ios/.xcode.env.local
          cat ios/.xcode.env.local
      - name: Install CocoaPods
        script: |
          cd app/ios
          pod install
      - name: Verify Xcode Compilation (Simulator)
        script: |
          xcodebuild -workspace "app/ios/Treegoh.xcworkspace" \
            -scheme "Treegoh" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
